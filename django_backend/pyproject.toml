[project]
name = "django-backend"
version = "2.4.5"
description = "NASSAV Django Backend with Celery async task support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "redis>=5.0",
    "pyyaml>=6.0",
    "curl-cffi>=0.14.0",
    "pillow>=11.0",
    "loguru>=0.7",
    "pip>=25.3",
    "uvicorn>=0.40.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "bs4>=0.0.2",
    "websockets>=15.0.1",
    "django-cors-headers>=4.9.0",
    "drf-spectacular>=0.28.1",
    "daphne>=4.2.1",
    "psycopg[binary]>=3.2.3",
    "cryptography>=46.0.3",
    "httpx[socks]>=0.28.1,<0.29",
]

[project.scripts]
nassav-api = "django_project.dev_commands:run_api"
nassav-worker-default = "django_project.dev_commands:run_default_worker"
nassav-worker-scrape = "django_project.dev_commands:run_scrape_worker"
nassav-worker-download = "django_project.dev_commands:run_download_worker"
nassav-beat = "django_project.dev_commands:run_beat"

[dependency-groups]
dev = [
    "celery-types>=0.24.0",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "coverage>=7.13.1",
    "django-stubs==5.2.9",
    "djangorestframework-stubs==3.16.8",
    "types-pyyaml==6.0.12.20250915",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_project*", "nassav*"]
