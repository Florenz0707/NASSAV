# Proxy.Enable/url 共用于视频来源页面、JavBus 等元数据 scraper（含封面/头像）和 Byparr 浏览器
# download_url 为空时视频下载器直连，不回退使用 url
# Compose 中的 Django 直接请求代理；宿主机代理应使用 host.docker.internal。
Proxy:
  Enable: false
  url: http://host.docker.internal:443
  download_url: null

# Compose 内部 Byparr；宿主机开发仍使用 template-config.yaml 的地址
BrowserFetch:
  Enable: true
  provider: byparr
  url: http://byparr:8191
  timeout_ms: 60000
  # 同一代理服务跨 worker 的容量；不依赖 provider 名称，1 为串行。
  max_concurrency: 2
  # 仅控制完整会话复用；不改变各源的 browser_fetch_strategy 抓取顺序。
  session_reuse_enabled: false

# 文件路径前缀配置
# 用于在返回视频文件绝对路径时添加前缀（如 WSL 路径转换）
FilePathPrefix: null

# 备份数据路径
# 用于 sync_backups 命令的目标同步目录
# 注意：backup_database 和 backup_avid_list 命令仍使用项目根目录下的 backup/ 目录
BackupPath: /app/backup_sync

# 元数据抓取器配置
Scraper:
  javbus:
    domain: www.javbus.com
  busdmm:
    domain: www.busdmm.ink
  dmmsee:
    domain: www.dmmsee.bond

# 视频下载源配置
Source:
  missav:
    domain: missav.ai
    weight: 1000
    browser_fetch_strategy: browser_first
  jable:
    domain: jable.tv
    weight: 800
    browser_fetch_strategy: direct_first
  memo:
    domain: memojav.com
    weight: 600

# 翻译器配置
# 用于将日语标题翻译为中文
Translator:
  # 使用哪个翻译服务
  active: qwen2.5:7b

  # 翻译服务配置
  qwen2.5:7b:
    # 翻译服务类型
    type: ollama
    # 默认连接宿主机；--profile translator 时由 OLLAMA_URL 覆盖为 http://ollama:11434
    url: http://host.docker.internal:11434

    # 使用的模型
    # 推荐模型：
    #   - qwen2.5:7b (中文翻译质量最好，推荐)
    #   - llama3.2:3b (速度快，资源占用小)
    #   - gemma2:9b (平衡性能和质量)
    model: qwen2.5:7b

    # 请求超时时间（秒）
    timeout: 30

    # 最大重试次数
    max_retries: 3

    # 翻译提示模板
    # {text} 会被替换为待翻译的文本
    # 简洁版本，避免 Ollama 解析错误
    prompt_template: >-
      你是专业的日语-中文翻译专家。请将以下日语标题翻译成简体中文。

      翻译规则：1)保留人名不翻译 2)保留番号和系列名 3)使用自然流畅的中文
      4)保持原文情境 5)只返回翻译结果

      日语标题：{text}

      中文翻译：

# 抓取事实与播放链接持久缓存；删除资源不删除缓存。
ResourceCache:
  SourceTTLSeconds: 604800
  ScraperTTLSeconds: 2592000
  PlaybackTTLSeconds: 300
  MetadataRetentionDays: 90
  PlaybackGraceHours: 24
  CleanupBatchSize: 500
