# Optional dedicated keyring bind: reuse the existing file, never create a key.
x-credential-runtime: &credential-runtime
  environment:
    NASSAV_SOURCE_CREDENTIAL_KEYRING_FILE: /run/nassav/source-credentials.json
  volumes:
    - type: bind
      source: ${NASSAV_SOURCE_CREDENTIAL_KEYRING_HOST_FILE:?Set the host path to the existing credential keyring}
      target: /run/nassav/source-credentials.json
      read_only: true
      bind:
        create_host_path: false

services:
  api: *credential-runtime
  scrape-worker: *credential-runtime
  download-worker: *credential-runtime
  default-worker: *credential-runtime
  migrate: *credential-runtime
  beat: *credential-runtime
  ollama-model: *credential-runtime
