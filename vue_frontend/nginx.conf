map $http_x_forwarded_proto $nassav_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

log_format nassav_media '$remote_addr "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=1s ipv6=off;
    set $api_upstream api:9790;

    location /nassav/ws/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nassav_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # External actor/genre search collects up to five browser-backed source pages.
    location ~ ^/nassav/api/(actors|genres)/[0-9]+/detail$ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nassav_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }

    # HLS media must not spill into nginx proxy temporary files.
    location ~ ^/nassav/api/playback-sessions/[^/]+/(manifest|assets)/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $nassav_forwarded_proto;
        access_log /var/log/nginx/access.log nassav_media;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location /nassav/api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nassav_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
