repos:
  # 基础文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Prettier (JS / TS / JSON / Markdown / YAML)
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier

  # Markdown 规范检查
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        args: ['--fix'] # 自动修复可修复的问题

  # YAML lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Python lint + formatter (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: ['--fix'] # 自动修复可修复的问题
      - id: ruff-format

  # Python 类型检查
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright

  # 本地编译检查
  - repo: local
    hooks:
      - id: django-backend-compile-check
        name: django_backend compile check
        entry: bash -c 'cd django_backend && uv run python -m compileall -q .'
        language: system
        pass_filenames: false
        always_run: true
      - id: vue-frontend-build-check
        name: vue_frontend build check
        entry: bash -c 'cd vue_frontend && pnpm i && pnpm run build'
        language: system
        pass_filenames: false
        always_run: true
      - id: vue-frontend-eslint
        name: vue_frontend eslint
        entry: bash -c 'cd vue_frontend && pnpm run lint:fix'
        language: system
        pass_filenames: false
        always_run: true

ci:
  autoupdate_schedule: weekly
