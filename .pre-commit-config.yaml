repos:
  # 基础文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # 与 VS Code 共用项目内 Prettier 和根配置；先安装前端依赖。
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: >-
          node vue_frontend/node_modules/prettier/bin/prettier.cjs
          --config .prettierrc --write --ignore-unknown
        language: system
        types: [text]

  # Markdown 规范检查
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ['--fix'] # 自动修复可修复的问题

  # YAML lint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Python lint + formatter (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ['--fix'] # 自动修复可修复的问题
      - id: ruff-format

  # Python 类型检查
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright

  # 本地编译检查
  - repo: local
    hooks:
      - id: django-backend-compile-check
        name: django_backend compile check
        entry: bash -c 'cd django_backend && uv run python -m compileall -q .'
        language: system
        pass_filenames: false
        files: ^django_backend/.*\.py$
      - id: vue-frontend-eslint
        name: vue_frontend eslint
        entry: >-
          bash -c 'cd vue_frontend && files=(); for file in "$@"; do case "$file" in
          vue_frontend/*) files+=("${file#vue_frontend/}") ;; esac; done; if [
          ${#files[@]} -eq 0 ]; then exit 0; fi; pnpm exec eslint --fix "${files[@]}"'
          --
        language: system
        files: ^vue_frontend/.*\.(js|jsx|ts|tsx|vue)$
      - id: vue-frontend-build-check
        name: vue_frontend build check
        entry: bash -c 'cd vue_frontend && pnpm i && pnpm run build'
        language: system
        pass_filenames: false
        files: ^vue_frontend/

ci:
  autoupdate_schedule: weekly
